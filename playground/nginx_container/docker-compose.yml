version: '3.8'

services:
  nginx-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artemis-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount certificates from host (or let entrypoint generate dev certs)
      - ./certs:/etc/nginx/certs:ro
    networks:
      - artemis-net
    extra_hosts:
      # Allows reaching Cuttlefish / Cloud Orchestrator running on the COS host
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  artemis-net:
    name: artemis-net
    driver: bridge
